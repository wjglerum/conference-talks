version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    # Bundle every Maven bump into one pull request.
    groups:
      maven:
        patterns:
          - "*"
